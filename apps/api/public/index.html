<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>JewelleryHub API</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        font: 15px/1.6 ui-sans-serif, system-ui, sans-serif; padding: 24px;
      }
      main { max-width: 32rem; }
      h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.5rem; }
      p { margin: 0 0 0.75rem; opacity: 0.75; }
      code { font-family: ui-monospace, monospace; font-size: 0.875em; }
    </style>
  </head>
  <body>
    <main>
      <h1>JewelleryHub API</h1>
      <p>
        This host serves the API only. Endpoints live under
        <code>/v1</code> &mdash; for example <code>/v1/health</code>.
      </p>
      <p>The shop itself is a separate deployment.</p>
    </main>
  </body>
</html>
