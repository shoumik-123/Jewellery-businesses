<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-label="A white gold solitaire engagement ring with a raised diamond">
  <title>A white gold solitaire engagement ring with a raised diamond</title>
  <defs>
