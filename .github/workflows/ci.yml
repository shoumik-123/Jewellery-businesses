name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '12.18.0'

jobs:
  quality:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Run unit tests with coverage
        run: pnpm test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: packages/*/coverage
          retention-days: 7

  database:
    name: Migrations, RLS and seed
    runs-on: ubuntu-latest

    # Real PostgreSQL, not the WASM dev server: the tenant-isolation checks
    # that the local server cannot run are verified here, and this job is a
    # required check precisely for that reason.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jewelleryhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/jewelleryhub
      DIRECT_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jewelleryhub
      SEED_SUPER_ADMIN_EMAIL: ci-admin@jewelleryhub.test
      SEED_SUPER_ADMIN_PASSWORD: ci-only-password-not-a-secret
      SEED_DEMO_DATA: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: Apply migrations from empty
        run: pnpm db:deploy

      - name: Fail if the schema and the migrations have drifted
        run: pnpm exec prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --shadow-database-url "$DATABASE_URL" --exit-code
        # --exit-code: 0 = no difference, 2 = the schema has changes with no migration.

      - name: Fail if the generated RLS policies are stale
        run: pnpm db:rls -- --check

      - name: Verify tenant isolation against real PostgreSQL
        run: pnpm db:verify-rls

      - name: Seed, then seed again (must be idempotent)
        run: |
          pnpm db:seed
          pnpm db:seed

      - name: Refuse demo data in production mode
        run: |
          if NODE_ENV=production pnpm db:seed; then
            echo "::error::The seed ran with NODE_ENV=production and SEED_DEMO_DATA=true. It must refuse."
            exit 1
          fi
          echo "Correctly refused to seed demo data in production mode."

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm build

  security:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies (high and above)
        run: pnpm audit --audit-level high
      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
